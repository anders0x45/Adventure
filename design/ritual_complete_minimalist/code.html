<!-- Micro-interaction Script for Minimal Confetti -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#00E5FF', '#c3f5ff', '#ffffff', '#283044']; // Minimal sleek colors
            
            function createParticle() {
                const particle = document.createElement('div');
                
                // Randomize properties
                const size = Math.random() * 4 + 2; // Smaller, sharper particles
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const duration = Math.random() * 4 + 3;
                const delay = Math.random() * 0.5;
                
                // Styling
                particle.style.position = 'absolute';
                particle.style.bottom = '-10px';
                particle.style.left = `${left}%`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = color;
                // Sharp edges or tiny dots
                particle.style.borderRadius = Math.random() > 0.7 ? '50%' : '0px';
                particle.style.opacity = '0';
                particle.style.boxShadow = color === '#00E5FF' ? '0 0 8px rgba(0, 229, 255, 0.4)' : 'none';
                
                // Animation via Web Animations API
                const animation = particle.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 0 },
                    { transform: 'translateY(-10vh) rotate(90deg)', opacity: Math.random() * 0.5 + 0.2, offset: 0.2 },
                    { transform: `translateY(-${Math.random() * 70 + 30}vh) rotate(${Math.random() * 360 + 180}deg) translateX(${Math.random() * 60 - 30}px)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    easing: 'cubic-bezier(0.1, 1, 0.5, 1)',
                    fill: 'forwards'
                });

                container.appendChild(particle);

                // Cleanup
                animation.onfinish = () => {
                    particle.remove();
                };
            }

            // Subtle burst of particles on load
            for (let i = 0; i < 25; i++) {
                createParticle();
            }
        });
    </script>
